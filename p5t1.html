<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>เฉลยคณิต ป.5 ปลายภาค 1</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;text-align:center;color:#333;
  font-family:system-ui,sans-serif;background:#f2f5fb
}
h3{margin:14px 0 10px;font-size:20px}
#scanner{
  width:260px;height:210px;margin:12px auto;
  border:4px solid #5b7cfa;border-radius:18px;
  overflow:hidden;background:#111;position:relative;
  box-shadow:0 8px 18px #0002
}
video{width:100%;height:100%;object-fit:cover}
#scanner:after{
  content:"";position:absolute;inset:25% 15%;
  border:2px solid #fffC;border-radius:10px
}
#status{
  margin:8px 0;min-height:22px;
  color:#5b7cfa;font-size:14px;font-weight:600
}
.error{color:#d33!important}
#out{
  max-width:390px;margin:14px auto;padding:16px;
  background:#fff;border-radius:16px;
  box-shadow:0 6px 16px #0002;
  text-align:left;font-size:16px;line-height:1.9
}
button{
  border:0;padding:10px 20px;border-radius:999px;
  background:#5b7cfa;color:white;font-size:15px;
  font-weight:600;cursor:pointer
}
.hidden{display:none}
.badge{
  display:inline-block;margin-bottom:8px;padding:5px 12px;
  border-radius:999px;background:#5b7cfa;color:#fff;font-size:14px
}
.answer-line{margin:3px 0}
.answer-label{font-weight:600}
hr{border:0;border-top:1px solid #ddd;margin:10px 0}
.fraction{
  display:inline-flex;flex-direction:column;
  vertical-align:middle;text-align:center;
  line-height:1.05;margin:0 3px
}
.top{border-bottom:1px solid #333;padding:0 4px 2px}
.bottom{padding:2px 4px 0}
.mixed{display:inline-flex;align-items:center;gap:3px}
.volume-answer{font-weight:600}

@media(max-width:400px){
  #scanner{width:230px;height:190px}
  #out{margin-left:12px;margin-right:12px}
}
</style>
</head>

<body>

<h3>📸 สแกน QR Code / Barcode ป.5</h3>

<div id="scanner">
  <video id="v" autoplay playsinline></video>
</div>

<div id="status">🔍 กำลังเตรียมกล้อง…</div>
<button id="restartBtn" class="hidden">🔄 สแกนใหม่</button>
<div id="out"></div>

<script>
const $=id=>document.getElementById(id);
const v=$("v"),out=$("out"),status=$("status"),restart=$("restartBtn");

let stream,detector,scanning=false,lastValue="",timer;

/* ---------- เศษส่วน ---------- */
const gcd=(a,b)=>{
  while(b)[a,b]=[b,a%b];
  return Math.abs(a)||1;
};

function frac(n,d=1){
  if(!d)throw Error("หารด้วยศูนย์");
  if(d<0)[n,d]=[-n,-d];
  let g=gcd(n,d);
  return {n:n/g,d:d/g};
}

const F=n=>frac(n);
const add=(a,b)=>frac(a.n*b.d+b.n*a.d,a.d*b.d);
const sub=(a,b)=>frac(a.n*b.d-b.n*a.d,a.d*b.d);
const mul=(a,b)=>frac(a.n*b.n,a.d*b.d);
const div=(a,b)=>{
  if(!b.n)throw Error("หารด้วยศูนย์");
  return frac(a.n*b.d,a.d*b.n);
};
const square=a=>mul(a,a);

/* ---------- แสดงผล ---------- */
function f(x){
  if(x?.n!==undefined)return fractionHTML(x);
  if(!Number.isFinite(x))return "ไม่สามารถคำนวณได้";
  if(Number.isInteger(x))return x.toLocaleString("en-US");
  return x.toFixed(2).replace(/0+$/,"").replace(/\.$/,"")
    .replace(/\B(?=(\d{3})+(?!\d))/g,",");
}

function fractionHTML({n,d}){
  if(d===1||n===0)return Number(n).toLocaleString("en-US");

  let sign=n<0?"-":"",a=Math.abs(n);
  if(a>d){
    let w=Math.floor(a/d),r=a%d;
    if(!r)return sign+w;
    return `<span class="mixed">
      <span>${sign}${w}</span>
      <span class="fraction">
        <span class="top">${r}</span>
        <span class="bottom">${d}</span>
      </span>
    </span>`;
  }

  return `<span class="fraction">
    <span class="top">${sign}${a}</span>
    <span class="bottom">${d}</span>
  </span>`;
}

function volume(cm3){
  cm3=Math.round(cm3);
  let l=Math.floor(cm3/1000),ml=cm3%1000;
  return `<span class="volume-answer">${
    l?l.toLocaleString("en-US")+" ลิตร ":""
  }${
    ml?ml.toLocaleString("en-US")+" มิลลิลิตร":
    (!l?"0 มิลลิลิตร":"")
  }</span>`;
}

/* ---------- กล้อง ---------- */
async function startCamera(){
  try{
    if(!navigator.mediaDevices?.getUserMedia)
      throw Error("ไม่รองรับกล้อง");

    if(!("BarcodeDetector" in window)){
      throw Error("Browser นี้ไม่รองรับ BarcodeDetector");
    }

    detector=new BarcodeDetector();

    stream=await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:{ideal:"environment"},
        width:{ideal:1280},
        height:{ideal:720}
      },
      audio:false
    });

    v.srcObject=stream;
    await v.play();

    scanning=true;
    lastValue="";
    restart.classList.add("hidden");
    status.classList.remove("error");
    status.textContent="🔍 กำลังสแกน… กรุณานำ Barcode ให้อยู่ในกรอบ";
    out.innerHTML="";
    scan();

  }catch(e){
    console.error(e);
    scanning=false;
    status.classList.add("error");
    status.textContent="❌ ไม่สามารถเปิดกล้องได้ กรุณาอนุญาตการใช้กล้อง";
    restart.classList.remove("hidden");
  }
}

function stopCamera(){
  scanning=false;
  clearTimeout(timer);
  stream?.getTracks().forEach(t=>t.stop());
  stream=null;
  v.srcObject=null;
}

async function scan(){
  if(!scanning)return;

  try{
    if(v.readyState>=2){
      const codes=await detector.detect(v);
      const val=codes[0]?.rawValue?.trim();
      if(val&&val!==lastValue){
        lastValue=val;
        calc(val);
      }
    }
  }catch(e){console.error(e)}

  if(scanning)timer=setTimeout(scan,500);
}

/* ---------- คำนวณ ---------- */
function calc(x){
  x=x.replace(/\*/g,"");

  if(!/^\d{15,16}$/.test(x)){
    status.classList.add("error");
    status.textContent="❌ รูปแบบข้อมูลไม่ถูกต้อง";
    out.innerHTML=`<div class="error">
      Barcode ต้องมีตัวเลข 15–16 หลัก
    </div>`;
    return;
  }

  const n=[
    +x.slice(0,2),
    +x.slice(2,3),
    +x.slice(3,5),
    +x.slice(5,6),
    +x.slice(6,7),
    +x.slice(7,8),
    +x.slice(8,9),
    +x.slice(9,10),
    +x.slice(10,12),
    +x.slice(12,14),
    +x.slice(14)
  ];

  const [n1,n2,n3,n4,n5,n6,n7,n8,n9,n10,n11]=n;

  if([n2,n4,n5,n6,n7].some(x=>x===0)){
    status.classList.add("error");
    status.textContent="❌ ข้อมูลไม่ถูกต้อง เนื่องจากมีตัวหารเป็น 0";
    out.innerHTML="";
    return;
  }

  const a=[
    sub(frac(n1,21),frac(2,7)),
    add(frac(19,8),frac(2,n2)),
    mul(F(n3),frac(2,3)),
    mul(frac(3,n4),frac(2,5)),
    square(frac(2,n5)),
    div(frac(2,5),F(n6)),
    div(frac(9,2),frac(2,n7)),
    sub(mul(frac(183,4),frac(5,4)),frac(n8*8+5,8)),
    24*34*(25-n9),
    20*36*n10
  ];

  const units=[
    "","ลิตร","เม็ด","","ตร.ม.","กก.","ถุง","กก.","ลบ.ม.",""
  ];

  out.innerHTML=`
    <div class="badge">เฉลย: ฉบับที่ ${n11}</div>
    ${a.map((x,i)=>`
      ${i===8?"<hr>":""}
      <div class="answer-line">
        <span class="answer-label">ข้อ ${i+1})</span>
        ${i===9?volume(x):f(x)}
        ${units[i]?`<span>${units[i]}</span>`:""}
      </div>
    `).join("")}
  `;

  status.classList.remove("error");
  status.textContent="✅ สแกนสำเร็จ";
  stopCamera();
  restart.classList.remove("hidden");
}

/* ---------- สแกนใหม่ ---------- */
restart.onclick=()=>{
  stopCamera();
  lastValue="";
  out.innerHTML="";
  status.classList.remove("error");
  status.textContent="🔍 กำลังเตรียมกล้อง…";
  startCamera();
};

startCamera();
</script>

</body>
</html>
