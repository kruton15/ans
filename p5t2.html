<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>เฉลยคณิต ป.5 ปลายภาค2</title>

<style>
body{
  margin:0;
  font-family:system-ui,sans-serif;
  background:#f2f5fb;
  text-align:center;
}
h3{margin:12px;color:#333}

#scanner{
  width:200px;height:180px;
  margin:10px auto;
  border-radius:18px;
  overflow:hidden;
  border:4px solid #5b7cfa;
  box-shadow:0 8px 18px rgba(0,0,0,.15);
}
video{width:100%;height:100%;object-fit:cover}

#status{
  font-size:14px;
  color:#5b7cfa;
  margin:6px 0;
}

#out{
  max-width:350px;
  margin:12px auto;
  background:#fff;
  border-radius:16px;
  padding:14px;
  box-shadow:0 6px 16px rgba(0,0,0,.1);
  text-align:left;
  font-size:15px;
  line-height:1.65;
}

.badge{
  display:inline-block;
  background:#5b7cfa;
  color:#fff;
  padding:4px 10px;
  border-radius:999px;
  font-size:13px;
  margin-bottom:8px;
}
.error{color:#d33}
</style>
</head>

<body>
<h3>📸 สแกน QR Code ป.5</h3>

<div id="scanner">
  <video id="v" autoplay playsinline></video>
</div>

<div id="status">🔍 กำลังสแกน…</div>
<div id="out"></div>

<script>
const v=document.getElementById("v"),
      out=document.getElementById("out"),
      status=document.getElementById("status");

let last="";

if(!("BarcodeDetector" in window)){
  status.innerHTML="❌ อุปกรณ์นี้ไม่รองรับการสแกน";
  throw "";
}

(async()=>{
  let stream=await navigator.mediaDevices.getUserMedia({
    video:{facingMode:"environment"}
  });
  v.srcObject=stream;

  let detector=new BarcodeDetector();
  setInterval(async()=>{
    let b=await detector.detect(v);
    if(b.length){
      let val=b[0].rawValue;
      if(val!==last){
        last=val;
        calc(val);
      }
    }
  },700);
})();

function f(x){
  let n = Number(x);

  // ปัดเป็นทศนิยมไม่เกิน 2 ตำแหน่ง
  let s = n.toFixed(2);

  // ถ้า .00 ให้ตัดทิ้ง
  if(s.endsWith(".00")){
    s = s.slice(0,-3);
  }else{
    // ตัด 0 ท้ายสุด เช่น 12.50 → 12.5
    s = s.replace(/0+$/,'').replace(/\.$/,'');
  }

  // ใส่เครื่องหมาย , หลักพัน
  let parts = s.split(".");
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  return parts.join(".");
}

function calc(x){
  // รองรับ Code 39 (IDAutomation)
  x = x.replace(/\*/g, "");

  if(!/^\d{17,}$/.test(x)){
    status.innerHTML="❌ รูปแบบข้อมูลไม่ถูกต้อง";
    out.innerHTML="";
    return;
  }

  status.innerHTML="✅ สแกนสำเร็จ";

  // แยกค่า
  let n1=parseInt(x.slice(0,2));
  let n2=parseInt(x.slice(2,4));
  let n3=parseInt(x.slice(4,6));
  let n4=parseInt(x.slice(6,8));
  let n5=parseInt(x.slice(8,11));
  let n6=parseInt(x.slice(11,13));
  let n7=parseInt(x.slice(13,15));
  let n8=parseInt(x.slice(15,16));
  let n9=parseInt(x.slice(16));


  // คำนวณ
  let a1=2*n1*1.3/100;
  let a2=(81+n2/100)/20;
  let a3=n3*4;
  let a4=600*(100-n4)/100;
  let a5=n5/36*10;
  let a6=(100+n6)*102/100;
  let a9=n7;
  let a11=180-50-n7;
  let a12=0.5*n8*18;

  out.innerHTML=`
  <div class="badge">เฉลย: ฉบับที่ ${n9}</div><br>
  ข้อ 1) ${f(a1)}<br>
  ข้อ 2) ${f(a2)} ซม.<br>
  ข้อ 3) ${f(a3)}%<br>
  ข้อ 4) ${f(a4)} คน<br>
  ข้อ 5) ${f(a5)} บาท<br>
  ข้อ 6) ${f(a6)} บาท<br>
  ข้อ 7) AB//DC<br>
  ข้อ 8) AB⊥EF, DC⊥EF<br>
  ข้อ 9) ${f(a9)}°<br>
  ข้อ 10) BD<br>
  ข้อ 11) ${f(a11)}°<br>
  ข้อ 12) ${f(a12)} ตร.ซม.<br>
  ข้อ 13) ครั้งที่ 2 และ ครั้งที่ 4 
  `;
}
</script>
</body>
</html>
